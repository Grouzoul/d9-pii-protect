# Reference deployment: d9 + the PII anonymization engine (sidecar).
#
#   - "engine" = the self-contained sidecar (Presidio FR + NER + AES-GCM encryption). ONE per environment.
#   - "d9"     = d9 with the PII Protect extension mounted (per-role hook).
#
# (Human-in-the-loop email approval — HITL — is phase 2; no mail server here.)
# Copy .env.example -> .env, set PII_PROTECT_KEY, then: docker compose up -d --build
services:
  engine:
    build:
      context: ../engine
      # To swap the NER model at build time: args: { PII_NER_MODEL: "<hf/model>" } (see engine/MODELS.md)
    image: pii-protect-engine:latest
    environment:
      # ===== SECURITY: encryption key. In production, inject via a secret manager/KMS. =====
      PII_PROTECT_KEY: ${PII_PROTECT_KEY:?Set PII_PROTECT_KEY in .env}
      # Choose what gets encrypted BY TYPE (empty = everything; see engine/app.py):
      PII_PROTECT_ENTITIES: ${PII_PROTECT_ENTITIES:-}   # allow-list (only these types), empty = no restriction
      PII_PROTECT_SKIP: ${PII_PROTECT_SKIP:-}           # deny-list (these types stay in clear)
      PII_NER_MODEL: ${PII_NER_MODEL:-Anonym-IA/V2-camembert-ner-pii-french}
      PII_NER_THRESHOLD: ${PII_NER_THRESHOLD:-0.4}
      # NER runs on ONNX Runtime. Threads: empty = auto; cap to your PHYSICAL/perf-core count on
      # heterogeneous CPUs (e.g. Apple Silicon: 4) to avoid oversubscription. Tune per host.
      PII_NER_ONNX_THREADS: ${PII_NER_ONNX_THREADS:-}
    # Not publicly exposed: only d9 (internal network) talks to the engine. Uncomment for local debug.
    # ports: ["8077:8077"]
    restart: unless-stopped

  d9:
    image: lawebcapsule/d9:latest   # public d9 image (Docker Hub). Pin a version (e.g. :12) for reproducibility.
    depends_on: [engine]
    ports: ["8055:8055"]
    environment:
      KEY: d9-pii-protect-key
      SECRET: d9-pii-protect-secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-pwd}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      EXTENSIONS_PATH: /directus/extensions
      CACHE_ENABLED: "false"
      # ===== The extension reads ITS engine here. No hardcoded environment coupling. =====
      PII_PROTECT_ENGINE_URL: http://engine:8077
      # Optional: narrow WHICH fields within a collection (JSON {collection:[fields]}). Empty = all 'text'
      # fields. WHICH collections are anonymized is set per role on the role page (not here).
      PII_PROTECT_FIELDS: ${PII_PROTECT_FIELDS:-}
    volumes:
      - ../extension:/directus/extensions/directus-extension-pii-protect:ro
      - d9_db:/directus/database
      - d9_uploads:/directus/uploads   # file binaries: must be persisted (otherwise lost on recreate)
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

volumes:
  d9_db:
  d9_uploads:
